services:
  - type: web
    name: hirelens-interviewer
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 90
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-terra
      - key: OPENAI_REALTIME_MODEL
        value: gpt-realtime-2.1-mini
      - key: OPENAI_REALTIME_VOICE
        value: marin
      - key: INTERVIEW_MAX_MINUTES
        value: "25"
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: INTERVIEW_ACCESS_CODE
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: hirelens-db
          property: connectionString

databases:
  - name: hirelens-db
    plan: basic-256mb
    databaseName: hirelens
    user: hirelens
